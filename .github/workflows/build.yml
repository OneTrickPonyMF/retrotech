name: Compilar mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: retrotech-jar
          path: build/libs/*.jar

      - name: Publicar en Releases (última versión de prueba)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: RetroTech (versión de prueba más reciente)
          body: Compilado automáticamente desde el último cambio en main. Poné el .jar en la carpeta mods de Forge 1.20.1.
          prerelease: true
          make_latest: false
          files: build/libs/*.jar
