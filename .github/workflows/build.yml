name: Compilar mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar
        run: gradle build --no-daemon --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: retrotech-jar
          path: build/libs/*.jar
